<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco familiar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#12181f;color:#eef2f6;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#left{width:36%;padding:48px 44px;background:#1a232d;display:flex;flex-direction:column}
#time{font-size:150px;font-weight:300;line-height:1;letter-spacing:-2px}
#date{font-size:36px;color:#9fb3c8;margin-top:12px}
#now{margin-top:44px;display:flex;align-items:center}
#now .ico{font-size:84px;margin-right:24px}
#now .t{font-size:84px;font-weight:300}
#now .d{font-size:26px;color:#9fb3c8;margin-top:4px}
#days{margin-top:auto;display:flex}
.wd{flex:1;text-align:center;padding:16px 4px;background:#223040;margin-right:10px;border-radius:14px}
.wd:last-child{margin-right:0}
.wd .n{font-size:22px;color:#9fb3c8;text-transform:uppercase}
.wd .i{font-size:44px;margin:6px 0}
.wd .m{font-size:22px;white-space:nowrap}
.wd .m span{color:#7f93a8}
.wd .r{font-size:20px;color:#6cb6ff;margin-top:4px;min-height:24px}
#right{flex:1;padding:48px 52px;overflow:hidden;display:flex;flex-direction:column}
#next{background:#2b6cb0;border-radius:22px;padding:28px 34px;margin-bottom:30px}
#next .l{font-size:22px;text-transform:uppercase;letter-spacing:2px;color:#cfe3fa}
#next .tt{font-size:50px;font-weight:500;margin-top:6px}
#next .w{font-size:28px;color:#e3effc;margin-top:6px}
#agenda{flex:1;overflow:hidden}
.day{margin-bottom:22px}
.day h3{font-size:26px;font-weight:500;color:#9fb3c8;text-transform:capitalize;margin-bottom:8px}
.day.today h3{color:#6cb6ff}
.ev{display:flex;align-items:baseline;font-size:32px;padding:7px 0;border-bottom:1px solid #26323f}
.ev .h{width:200px;color:#9fb3c8;flex:none}
.ev .x{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev.past{opacity:.4}
.empty{font-size:28px;color:#5d7186}
#status{position:absolute;right:16px;bottom:8px;font-size:16px;color:#4f6174}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="now"><div class="ico" id="nIco"></div><div><div class="t" id="nTemp"></div><div class="d" id="nDesc"></div></div></div>
    <div id="days"></div>
  </div>
  <div id="right">
    <div id="next"><div class="l" id="nL">Próximo</div><div class="tt" id="nT">Cargando…</div><div class="w" id="nW"></div></div>
    <div id="agenda"></div>
  </div>
</div>
<div id="status"></div>
<script>
/* Config: se guarda en el dispositivo la primera vez que abres la página con ?cal=URL_DEL_APPS_SCRIPT */
var LAT = 40.44, LON = -3.61;      // Madrid (28055)
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DIAS3 = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function $(id){ return document.getElementById(id); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function hhmm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function shortLoc(l){ return String(l).split(',')[0]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var calUrl = '';
try {
  var m = /[?&]cal=([^&]+)/.exec(location.search);
  if (m) { localStorage.setItem('calUrl', decodeURIComponent(m[1])); }
  calUrl = localStorage.getItem('calUrl') || '';
} catch (e) {}
var DEMO = !calUrl;
var events = [];

/* ---------- Reloj ---------- */
function tick(){
  var n = new Date();
  $('time').textContent = hhmm(n);
  var dn = DIAS[n.getDay()]; $('date').textContent = dn.charAt(0).toUpperCase() + dn.slice(1) + ', ' + n.getDate() + ' de ' + MESES[n.getMonth()];
  renderNext();
}
setInterval(tick, 10000);

/* ---------- Tiempo ---------- */
function wIcon(c){
  if (c === 0) return '☀️';
  if (c <= 2) return '⛅';
  if (c === 3) return '☁️';
  if (c === 45 || c === 48) return '🌫';
  if (c >= 51 && c <= 67) return '🌧';
  if (c >= 71 && c <= 77) return '❄️';
  if (c >= 80 && c <= 82) return '🌧';
  if (c >= 95) return '⛈';
  return '⛅';
}
function wDesc(c){
  if (c === 0) return 'Despejado';
  if (c <= 2) return 'Poco nuboso';
  if (c === 3) return 'Nublado';
  if (c === 45 || c === 48) return 'Niebla';
  if (c >= 51 && c <= 57) return 'Llovizna';
  if (c >= 61 && c <= 67) return 'Lluvia';
  if (c >= 71 && c <= 77) return 'Nieve';
  if (c >= 80 && c <= 82) return 'Chubascos';
  if (c >= 95) return 'Tormenta';
  return '';
}
function loadWeather(){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&timezone=Europe%2FMadrid&forecast_days=5';
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    $('nIco').textContent = wIcon(j.current.weather_code);
    $('nTemp').textContent = Math.round(j.current.temperature_2m) + '°';
    $('nDesc').textContent = wDesc(j.current.weather_code);
    var h = '';
    for (var i = 0; i < j.daily.time.length; i++){
      var d = new Date(j.daily.time[i] + 'T12:00:00');
      var p = j.daily.precipitation_probability_max[i];
      h += '<div class="wd"><div class="n">' + (i === 0 ? 'HOY' : DIAS3[d.getDay()]) + '</div>' +
        '<div class="i">' + wIcon(j.daily.weather_code[i]) + '</div>' +
        '<div class="m">' + Math.round(j.daily.temperature_2m_max[i]) + '° <span>' + Math.round(j.daily.temperature_2m_min[i]) + '°</span></div>' +
        '<div class="r">' + (p >= 20 ? p + '%' : '') + '</div></div>';
    }
    $('days').innerHTML = h;
  }).catch(function(){ $('status').textContent = 'Sin tiempo (sin conexión)'; });
}

/* ---------- Calendario ---------- */
function demoEvents(){
  var t = dayStart(new Date()), out = [];
  function ev(dd, h, mi, dur, title, place){
    var s = new Date(t.getFullYear(), t.getMonth(), t.getDate() + dd, h, mi);
    out.push({title: title, start: s.toISOString(), end: new Date(s.getTime() + dur * 60000).toISOString(), allDay: false, location: place || ''});
  }
  ev(0, 9, 0, 60, 'Dentista', 'Clínica Sol');
  ev(0, 17, 30, 90, 'Fútbol del peque', 'Polideportivo');
  ev(0, 21, 0, 60, 'Cena en casa');
  ev(1, 8, 30, 30, 'Reunión del colegio');
  ev(2, 19, 0, 120, 'Cumpleaños de la abuela');
  ev(4, 10, 0, 60, 'Revisión del coche', 'Taller');
  out.push({title: 'Puente: no hay cole', start: new Date(t.getFullYear(), t.getMonth(), t.getDate() + 3).toISOString(), end: new Date(t.getFullYear(), t.getMonth(), t.getDate() + 4).toISOString(), allDay: true, location: ''});
  return out;
}
function loadCalendar(){
  if (DEMO){ events = demoEvents(); render(); $('status').textContent = 'Modo demostración'; return; }
  fetch(calUrl).then(function(r){ return r.json(); }).then(function(j){
    if (j.error) throw new Error(j.error);
    events = j.events || [];
    $('status').textContent = '';
    render();
  }).catch(function(){ $('status').textContent = 'Calendario sin conexión · ' + hhmm(new Date()); });
}

function render(){ renderNext(); renderAgenda(); }

function renderNext(){
  var now = new Date(), cur = null, nxt = null, i, s, e;
  for (i = 0; i < events.length; i++){
    var ev = events[i]; if (ev.allDay) continue;
    s = new Date(ev.start); e = new Date(ev.end);
    if (s <= now && e > now && !cur) cur = ev;
    if (s > now && !nxt) nxt = ev;
  }
  var pick = cur || nxt;
  if (!pick){ $('nL').textContent = 'Próximo'; $('nT').textContent = 'Nada pendiente'; $('nW').textContent = ''; return; }
  s = new Date(pick.start);
  $('nL').textContent = cur ? 'Ahora' : 'Próximo';
  $('nT').textContent = pick.title;
  var w;
  if (cur) w = 'hasta las ' + hhmm(new Date(pick.end));
  else {
    var mins = Math.round((s - now) / 60000);
    if (mins < 60) w = 'en ' + mins + ' min';
    else if (dayStart(s).getTime() === dayStart(now).getTime()) w = 'hoy a las ' + hhmm(s);
    else w = DIAS[s.getDay()] + ' a las ' + hhmm(s);
  }
  if (pick.location) w += ' · ' + shortLoc(pick.location);
  $('nW').textContent = w;
}

function renderAgenda(){
  var now = new Date(), t0 = dayStart(now), html = '', d, i;
  for (d = 0; d < 7; d++){
    var a = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() + d), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1);
    var rows = '';
    for (i = 0; i < events.length; i++){
      var ev = events[i], s = new Date(ev.start), e = new Date(ev.end);
      if (!(s < b && e > a)) continue;
      var past = !ev.allDay && e < now;
      rows += '<div class="ev' + (past ? ' past' : '') + '"><div class="h">' + (ev.allDay ? 'Todo el día' : hhmm(s)) + '</div><div class="x">' + esc(ev.title) + (ev.location ? ' · ' + esc(shortLoc(ev.location)) : '') + '</div></div>';
    }
    var label = d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : DIAS[a.getDay()] + ' ' + a.getDate();
    if (d === 0 || rows) html += '<div class="day' + (d === 0 ? ' today' : '') + '"><h3>' + label + '</h3>' + (rows || '<div class="empty">Sin eventos</div>') + '</div>';
  }
  $('agenda').innerHTML = html;
}

tick(); loadWeather(); loadCalendar();
setInterval(loadCalendar, 5 * 60000);
setInterval(loadWeather, 30 * 60000);
setTimeout(function(){ location.reload(); }, 6 * 3600000); /* recarga cada 6 h */
</script>
</body>
</html>
