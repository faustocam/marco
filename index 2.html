<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco familiar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#f3ebe0;color:#2a2520;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1200px;display:flex;transform-origin:center center}
#rail{width:136px;background:#efe3d3;display:flex;flex-direction:column;align-items:center;padding:48px 0 28px}
.nb{width:92px;height:92px;border-radius:26px;margin-bottom:28px;display:flex;align-items:center;justify-content:center;color:#a8998a;cursor:pointer}
.nb svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb.on{background:#fff;color:#1f2a44;box-shadow:0 2px 10px rgba(80,60,30,.12)}
#rclock{margin-top:auto;font-size:64px;line-height:.95;font-weight:300;color:#7b6e61;text-align:center}
#main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;left:0;top:0;right:0;bottom:0;padding:28px 36px;display:none}
.view.on{display:block}
#v-hoy.on{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:276px minmax(0,1fr) 242px;row-gap:20px}
.card{background:#fffdf9;border-radius:30px;box-shadow:0 1px 3px rgba(80,60,30,.08)}
.row1{display:flex;min-width:0}
#top{flex:1 1 0;min-width:0;overflow:hidden;margin-right:20px;background:linear-gradient(135deg,#1c2548,#38407a);color:#fff;border-radius:34px;padding:34px 34px;display:flex;align-items:center;cursor:pointer}
#clock{font-size:168px;font-weight:300;line-height:.9;letter-spacing:-4px}
#dateL{font-size:38px;white-space:nowrap;margin-top:22px;color:#dfe4ff}
#dateL b{font-weight:600;color:#fff;margin-right:12px}
#wnow{text-align:center;margin-left:30px;margin-right:18px;width:130px;flex:none}
#wnow .i{font-size:84px;line-height:1}
#wnow .t{font-size:62px;font-weight:300;margin-top:4px}
#wnow .m{font-size:22px;color:#c4caf0}
#w5{display:flex;flex:none}
.w5{width:82px;height:162px;margin-right:7px;background:rgba(255,255,255,.14);border-radius:22px;text-align:center;padding-top:12px}
.w5 .n{font-size:22px;color:#e1e5ff}.w5 .i{font-size:38px;margin:6px 0}.w5 .x{font-size:26px;font-weight:600}.w5 .y{font-size:22px;color:#c4caf0}.w5 .r{font-size:18px;color:#9fd0ff;margin-top:4px}
#nxt{width:564px;flex:none;background:#2f9e5b;color:#fff;border-radius:34px;padding:34px 36px;cursor:pointer}
#nxt .h{display:flex;justify-content:space-between;align-items:center}
#nxt .l{font-size:20px;letter-spacing:4px;color:#d3f2de}
#nxt .c{background:rgba(255,255,255,.2);border-radius:30px;padding:8px 20px;font-size:26px;font-weight:600}
#nxt .tt{font-size:48px;font-weight:600;margin-top:30px;line-height:1.1}
#nxt .w{font-size:28px;color:#e3f7ea;margin-top:12px}
#week{display:flex;overflow:hidden;min-width:0}
.col{flex:1 1 0;min-width:0;margin-right:12px;background:#fffdf9;border-radius:28px;padding:20px 14px 14px;overflow:hidden;box-shadow:0 1px 3px rgba(80,60,30,.08)}
.col:last-child{margin-right:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 12px;border-bottom:2px solid #efe6da;margin-bottom:12px}
.ch .a{font-size:26px;font-weight:500;color:#5a5047}.ch .b{font-size:36px;font-weight:600}
.col.today .a,.col.today .b{color:#d1243c}
.ad{background:#cfe6d3;color:#2a5a3a;border-radius:10px;padding:5px 10px;font-size:20px;margin-bottom:8px}
.ev{border-left:5px solid #7a8aa0;padding:2px 0 2px 12px;margin-bottom:14px}
.ev .h{font-size:22px;color:#8b7f73}.ev .t{font-size:27px;line-height:1.15}
.ev.past{opacity:.4}
.more{font-size:20px;color:#8b7f73;padding-left:4px}
.row3{display:flex;min-width:0}
.bc{flex:1 1 0;min-width:0;margin-right:20px;padding:24px 30px;overflow:hidden;cursor:pointer}
.bc:last-child{margin-right:0}
.bc .k{font-size:20px;letter-spacing:4px;font-weight:600;color:#c9792a}
.bc .big{font-size:42px;font-weight:600;margin-top:12px}
.bc .sm{font-size:26px;color:#7b6e61;margin-top:8px;line-height:1.3}
.chip{display:inline-block;background:#dfeaff;border-radius:20px;padding:6px 16px;font-size:26px;margin:10px 10px 0 0}
.vt{font-size:44px;font-weight:600;margin-bottom:22px}
.vsub{font-size:26px;color:#7b6e61;margin-bottom:20px}
#v-cal .days{column-count:2;column-gap:28px}
.dd{break-inside:avoid;margin-bottom:18px;background:#fffdf9;border-radius:24px;padding:16px 22px}
.dd h4{font-size:28px;font-weight:600;margin-bottom:8px}.dd.today h4{color:#d1243c}
.dd .ev{margin-bottom:10px}
.hrs{display:flex;margin-bottom:22px}
.hr{flex:1;text-align:center;background:#fffdf9;border-radius:20px;padding:12px 0;margin-right:8px;font-size:22px}
.hr .i{font-size:34px}
.d7{display:flex}
.d7 .col{text-align:center;padding-top:24px}
.d7 .i{font-size:64px;margin:12px 0}.d7 .x{font-size:34px;font-weight:600}.d7 .y{font-size:28px;color:#7b6e61}
.two{display:flex}.two>div{flex:1;margin-right:20px}.two>div:last-child{margin-right:0}
.pane{background:#fffdf9;border-radius:28px;padding:24px 28px;min-height:420px}
.chore{display:flex;align-items:center;font-size:34px;padding:16px 6px;border-bottom:1px solid #efe6da;cursor:pointer}
.chore .bx{width:44px;height:44px;border-radius:12px;border:3px solid #c9bfb2;margin-right:20px;text-align:center;line-height:38px;font-size:30px;color:#fff}
.chore.done .bx{background:#2f9e5b;border-color:#2f9e5b}.chore.done .tx{color:#9a8f84;text-decoration:line-through}
.shop{display:flex;justify-content:space-between;align-items:center;font-size:32px;padding:12px 6px;border-bottom:1px solid #efe6da}
.shop span.x{color:#b5a99c;font-size:30px;padding:0 10px;cursor:pointer}
input.add,textarea{width:100%;font-size:30px;padding:14px 18px;border-radius:16px;border:2px solid #e0d5c7;background:#fff;margin-bottom:12px;font-family:inherit}
textarea{height:150px}
.btn{display:inline-block;background:#1f2a44;color:#fff;border-radius:18px;padding:14px 28px;font-size:26px;margin:8px 12px 0 0;cursor:pointer}
.btn.l{background:#e8dccb;color:#3b3228}
#night{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:9;display:none;align-items:center;justify-content:center;color:#c0392b;font-size:300px;font-weight:300}
#status{position:absolute;right:44px;bottom:6px;font-size:18px;color:#a8998a}
</style>
</head>
<body>
<div id="stage">
 <div id="rail">
  <div class="nb on" data-v="hoy"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><rect x="7.5" y="13" width="3" height="3"/></svg></div>
  <div class="nb" data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg></div>
  <div class="nb" data-v="tiempo"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 010-8 5.5 5.5 0 0110.6 1.5A3.3 3.3 0 0117 18z"/></svg></div>
  <div class="nb" data-v="tareas"><svg viewBox="0 0 24 24"><path d="M4 6l2 2 3-3M4 14l2 2 3-3M12 7h8M12 15h8"/></svg></div>
  <div class="nb" data-v="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></div>
  <div class="nb" id="nightBtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></div>
  <div id="rclock"></div>
 </div>
 <div id="main">
  <div class="view on" id="v-hoy">
   <div class="row1">
    <div id="top"><div><div id="clock">--:--</div><div id="dateL"></div></div><div id="wnow"></div><div id="w5"></div></div>
    <div id="nxt"></div>
   </div>
   <div id="week"></div>
   <div class="row3">
    <div class="card bc" data-go="tareas" id="bKids"></div>
    <div class="card bc" data-go="tareas" id="bShop"></div>
    <div class="card bc" id="bDinner"></div>
   </div>
  </div>
  <div class="view" id="v-cal"><div class="vt">Calendario</div><div class="days" id="calDays"></div></div>
  <div class="view" id="v-tiempo"><div class="vt">Tiempo en Madrid</div><div class="hrs" id="hrs"></div><div class="d7" id="d7"></div></div>
  <div class="view" id="v-tareas"><div class="vt">Tareas y compra</div><div class="two">
    <div class="pane"><div class="vsub" id="kidSub"></div><div id="chores"></div></div>
    <div class="pane"><input class="add" id="shopIn" placeholder="Añadir a la compra…"><div class="btn" id="shopAdd">Añadir</div><div class="btn l" id="shopClr">Vaciar lista</div><div id="shopList"></div></div>
  </div></div>
  <div class="view" id="v-ajustes"><div class="vt">Ajustes</div><div class="two">
    <div class="pane"><div class="vsub">Tareas del peque (una por línea)</div><textarea id="setChores"></textarea>
     <div class="vsub" style="margin-top:14px">Ideas para cenar (una por línea)</div><textarea id="setDinners"></textarea>
     <div class="btn" id="saveSet">Guardar</div></div>
    <div class="pane"><div class="vsub" id="calInfo"></div><div class="btn l" id="resetCal">Olvidar calendario</div><div class="btn l" id="reload">Recargar página</div></div>
  </div></div>
  <div id="status"></div>
 </div>
</div>
<div id="night"></div>
<script>
var LAT = 40.44, LON = -3.61;
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var COLORS = ['#3d7dd8','#2f9e5b','#d1495b','#8a5bd1','#d98a1f','#1f9aa8'];
function $(id){ return document.getElementById(id); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function hhmm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dstart(d,o){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + (o || 0)); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shortLoc(l){ return String(l).split(',')[0]; }
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function dayKey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

/* escala al tamaño de la pantalla */
function fit(){ var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1200); $('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();

/* config calendario */
var calUrl = '';
try { var mm = /[?&]cal=([^&]+)/.exec(location.search); if (mm) localStorage.setItem('calUrl', decodeURIComponent(mm[1])); calUrl = localStorage.getItem('calUrl') || ''; } catch (e) {}
var DEMO = !calUrl, events = [], weather = null;

/* navegación */
function go(v){
  var vs = document.getElementsByClassName('view'), i;
  for (i = 0; i < vs.length; i++) vs[i].className = 'view' + (vs[i].id === 'v-' + v ? ' on' : '');
  var nb = document.getElementsByClassName('nb');
  for (i = 0; i < nb.length; i++) nb[i].className = 'nb' + (nb[i].getAttribute('data-v') === v ? ' on' : '');
}
(function(){ var nb = document.getElementsByClassName('nb'), i; for (i = 0; i < nb.length; i++) (function(b){ if (b.getAttribute('data-v')) b.onclick = function(){ go(b.getAttribute('data-v')); }; })(nb[i]);
  var gs = document.querySelectorAll('[data-go]'); for (i = 0; i < gs.length; i++) (function(g){ g.onclick = function(){ go(g.getAttribute('data-go')); }; })(gs[i]);
  $('top').onclick = function(){ go('tiempo'); }; $('nxt').onclick = function(){ go('cal'); }; })();
$('nightBtn').onclick = function(){ $('night').style.display = 'flex'; };
$('night').onclick = function(){ $('night').style.display = 'none'; };

/* tiempo */
function wIcon(c){ if (c === 0) return '☀️'; if (c <= 2) return '⛅'; if (c === 3) return '☁️'; if (c === 45 || c === 48) return '🌫'; if (c >= 51 && c <= 67) return '🌧'; if (c >= 71 && c <= 77) return '❄️'; if (c >= 80 && c <= 82) return '🌧'; if (c >= 95) return '⛈'; return '⛅'; }
function loadWeather(){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Europe%2FMadrid&forecast_days=7';
  fetch(url).then(function(r){ return r.json(); }).then(function(j){ weather = j; renderWeather(); }).catch(function(){ $('status').textContent = 'Sin datos del tiempo'; });
}
function renderWeather(){
  var j = weather, i; if (!j) return;
  var t = j.daily;
  $('wnow').innerHTML = '<div class="i">' + wIcon(j.current.weather_code) + '</div><div class="t">' + Math.round(j.current.temperature_2m) + '°</div><div class="m">' + Math.round(t.temperature_2m_min[0]) + '° / ' + Math.round(t.temperature_2m_max[0]) + '°</div>';
  var h = '', h7 = '';
  for (i = 0; i < 7; i++){
    var d = new Date(t.time[i] + 'T12:00:00'), p = t.precipitation_probability_max[i], nm = i === 0 ? 'Hoy' : DS[d.getDay()];
    if (i < 5) h += '<div class="w5"><div class="n">' + nm + '</div><div class="i">' + wIcon(t.weather_code[i]) + '</div><div class="x">' + Math.round(t.temperature_2m_max[i]) + '°</div><div class="y">' + Math.round(t.temperature_2m_min[i]) + '°</div><div class="r">' + (p >= 10 ? '💧' + p + '%' : '') + '</div></div>';
    h7 += '<div class="col"><div class="a" style="font-size:28px;color:#5a5047">' + nm + '</div><div class="i">' + wIcon(t.weather_code[i]) + '</div><div class="x">' + Math.round(t.temperature_2m_max[i]) + '°</div><div class="y">' + Math.round(t.temperature_2m_min[i]) + '°</div><div class="y" style="color:#3d7dd8;font-size:24px;margin-top:8px">' + (p >= 10 ? '💧 ' + p + '%' : '') + '</div></div>';
  }
  $('w5').innerHTML = h; $('d7').innerHTML = h7;
  var now = new Date(), hh = '', k = 0;
  for (i = 0; i < j.hourly.time.length && k < 8; i++){
    var ht = new Date(j.hourly.time[i]);
    if (ht.getTime() < now.getTime() - 3600000 || ht.getHours() % 3 !== 0 && k > 0 && false) continue;
    if (ht < now && ht.getHours() !== now.getHours()) continue;
    if (k > 0 && (ht.getHours() % 2) !== 0) continue;
    hh += '<div class="hr"><div>' + hhmm(ht) + '</div><div class="i">' + wIcon(j.hourly.weather_code[i]) + '</div><div style="font-size:28px;font-weight:600">' + Math.round(j.hourly.temperature_2m[i]) + '°</div><div style="color:#3d7dd8">' + j.hourly.precipitation_probability[i] + '%</div></div>'; k++;
  }
  $('hrs').innerHTML = hh;
}

/* calendario */
function demoEvents(){
  var t = dstart(new Date()), out = [];
  function ev(dd, h, mi, dur, title, place){ var s = new Date(t.getFullYear(), t.getMonth(), t.getDate() + dd, h, mi); out.push({title: title, start: s.toISOString(), end: new Date(s.getTime() + dur * 60000).toISOString(), allDay: false, location: place || ''}); }
  ev(0, 9, 0, 60, 'Dentista', 'Clínica Sol'); ev(0, 18, 30, 60, 'Peque: Salida de robótica', 'Colegio'); ev(1, 18, 0, 60, 'Peque: Salida de inglés', 'Colegio'); ev(2, 16, 0, 60, 'Peque: Salida de judo', 'Colegio'); ev(2, 21, 0, 90, 'Cena con los abuelos'); ev(4, 10, 0, 60, 'Revisión del coche', 'Taller'); ev(5, 11, 0, 120, 'Cumpleaños de Marcos', 'Parque');
  out.push({title: 'Día sin cole', start: dstart(new Date(), 3).toISOString(), end: dstart(new Date(), 4).toISOString(), allDay: true, location: ''});
  return out;
}
function loadCalendar(){
  if (DEMO){ events = demoEvents(); renderAll(); $('status').textContent = 'Modo demostración'; return; }
  fetch(calUrl).then(function(r){ return r.json(); }).then(function(j){ if (j.error) throw new Error(j.error); events = j.events || []; $('status').textContent = ''; renderAll(); }).catch(function(){ $('status').textContent = 'Calendario sin conexión · ' + hhmm(new Date()); });
}
function colorFor(t){ var p = String(t).split(':'); if (p.length < 2) return '#7a8aa0'; var h = 0, s = p[0], i; for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997; return COLORS[h % COLORS.length]; }
function evsOn(a, b){ var out = [], i; for (i = 0; i < events.length; i++){ var s = new Date(events[i].start), e = new Date(events[i].end); if (s < b && e > a) out.push(events[i]); } return out; }
function evHtml(ev, now){ var s = new Date(ev.start), past = !ev.allDay && new Date(ev.end) < now; return '<div class="ev' + (past ? ' past' : '') + '" style="border-left-color:' + colorFor(ev.title) + '"><div class="h">' + hhmm(s) + '</div><div class="t">' + esc(ev.title) + (ev.location ? ' <span style="color:#8b7f73;font-size:22px">· ' + esc(shortLoc(ev.location)) + '</span>' : '') + '</div></div>'; }

function renderNext(){
  var now = new Date(), cur = null, nxt = null, i;
  for (i = 0; i < events.length; i++){ var ev = events[i]; if (ev.allDay) continue; var s = new Date(ev.start), e = new Date(ev.end); if (s <= now && e > now && !cur) cur = ev; if (s > now && !nxt) nxt = ev; }
  var p = cur || nxt;
  if (!p){ $('nxt').innerHTML = '<div class="h"><div class="l">LO PRÓXIMO</div></div><div class="tt">Nada pendiente</div>'; return; }
  var s2 = new Date(p.start), e2 = new Date(p.end), chip, sub;
  if (cur){ chip = 'hasta las ' + hhmm(e2); sub = 'En curso'; }
  else { var mins = Math.round((s2 - now) / 60000);
    if (mins < 60) chip = 'en ' + mins + ' min'; else if (mins < 1440) chip = 'en ' + Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min'; else chip = 'en ' + Math.round(mins / 1440) + ' días';
    var dd = Math.round((dstart(s2) - dstart(now)) / 86400000);
    sub = (dd === 0 ? 'Hoy' : dd === 1 ? 'Mañana' : cap(DIAS[s2.getDay()])) + ' · ' + hhmm(s2) + '–' + hhmm(e2); }
  if (p.location) sub += ' · ' + shortLoc(p.location);
  $('nxt').innerHTML = '<div class="h"><div class="l">' + (cur ? 'AHORA' : 'LO PRÓXIMO') + '</div><div class="c">' + chip + '</div></div><div class="tt">' + esc(p.title) + '</div><div class="w">' + esc(sub) + '</div>';
}
function renderWeek(){
  var now = new Date(), h = '', d;
  for (d = 0; d < 7; d++){
    var a = dstart(now, d), b = dstart(now, d + 1), list = evsOn(a, b), ad = '', body = '', n = 0, more = 0, i;
    for (i = 0; i < list.length; i++){ if (list[i].allDay) ad += '<div class="ad">' + esc(list[i].title) + '</div>'; else if (n < 5){ body += evHtml(list[i], now); n++; } else more++; }
    h += '<div class="col' + (d === 0 ? ' today' : '') + '"><div class="ch"><div class="a">' + (d === 0 ? 'Hoy' : DS[a.getDay()]) + '</div><div class="b">' + a.getDate() + '</div></div>' + ad + body + (more ? '<div class="more">+' + more + ' más</div>' : '') + '</div>';
  }
  $('week').innerHTML = h;
}
function renderCal(){
  var now = new Date(), h = '', d, any = false;
  for (d = 0; d < 21; d++){ var a = dstart(now, d), list = evsOn(a, dstart(now, d + 1)); if (!list.length && d > 0) continue; any = true; var body = '', i;
    for (i = 0; i < list.length; i++) body += list[i].allDay ? '<div class="ad">' + esc(list[i].title) + '</div>' : evHtml(list[i], now);
    h += '<div class="dd' + (d === 0 ? ' today' : '') + '"><h4>' + (d === 0 ? 'Hoy' : cap(DIAS[a.getDay()])) + ' ' + a.getDate() + ' de ' + MESES[a.getMonth()] + '</h4>' + (body || '<div class="more">Sin eventos</div>') + '</div>'; }
  $('calDays').innerHTML = h;
}

/* niños, compra, cena (guardado en la tablet) */
var CHORES = lsGet('chores', ['Hacer la cama','Recoger los juguetes','Lavarse los dientes','Preparar la mochila']);
var DINNERS = lsGet('dinners', ['Tortilla de patatas y ensalada','Crema de verduras y pollo a la plancha','Pasta con tomate y atún','Merluza al horno con patatas','Lentejas con verduras','Pizza casera de verduras','Revuelto de champiñones y jamón','Salmón con arroz','Hamburguesa casera con ensalada','Sopa de pescado y tostadas']);
var kid = lsGet('kid', {day: '', done: {}, stars: 0});
var shop = lsGet('shop', []);
function kidFresh(){ var k = dayKey(new Date()); if (kid.day !== k){ kid.day = k; kid.done = {}; lsSet('kid', kid); } }
function renderKids(){
  kidFresh(); var n = 0, i; for (i = 0; i < CHORES.length; i++) if (kid.done[i]) n++;
  var all = CHORES.length && n === CHORES.length;
  $('bKids').innerHTML = '<div class="k">PEQUE</div><div class="big">' + (all ? '🎉 Todo hecho' : n + ' de ' + CHORES.length + ' tareas') + '</div><div><span class="chip">⭐ ' + n + ' hoy</span><span class="chip" style="background:#e4f2e0">⭐ ' + kid.stars + ' en total</span></div>';
  var h = ''; for (i = 0; i < CHORES.length; i++) h += '<div class="chore' + (kid.done[i] ? ' done' : '') + '" data-i="' + i + '"><div class="bx">' + (kid.done[i] ? '✓' : '') + '</div><div class="tx">' + esc(CHORES[i]) + '</div></div>';
  $('chores').innerHTML = h; $('kidSub').textContent = 'Estrellas: ' + n + ' hoy · ' + kid.stars + ' en total';
  var cs = document.getElementsByClassName('chore'); for (i = 0; i < cs.length; i++) (function(c){ c.onclick = function(){ var ix = c.getAttribute('data-i'); if (kid.done[ix]){ delete kid.done[ix]; kid.stars = Math.max(0, kid.stars - 1); } else { kid.done[ix] = true; kid.stars++; } lsSet('kid', kid); renderKids(); }; })(cs[i]);
}
function renderShop(){
  var n = shop.length; $('bShop').innerHTML = '<div class="k">COMPRA</div><div class="big">' + (n ? n + (n === 1 ? ' cosa' : ' cosas') : 'Lista vacía') + '</div><div class="sm">' + esc(shop.slice(0, 5).join(' · ')) + '</div>';
  var h = '', i; for (i = 0; i < n; i++) h += '<div class="shop"><span>' + esc(shop[i]) + '</span><span class="x" data-i="' + i + '">✕</span></div>';
  $('shopList').innerHTML = h;
  var xs = document.getElementsByClassName('x'); for (i = 0; i < xs.length; i++) (function(x){ if (x.getAttribute('data-i') !== null) x.onclick = function(){ shop.splice(parseInt(x.getAttribute('data-i'), 10), 1); lsSet('shop', shop); renderShop(); }; })(xs[i]);
}
$('shopAdd').onclick = function(){ var v = $('shopIn').value.replace(/^\s+|\s+$/g, ''); if (v){ shop.push(v); lsSet('shop', shop); $('shopIn').value = ''; renderShop(); } };
$('shopClr').onclick = function(){ shop = []; lsSet('shop', shop); renderShop(); };
function renderDinner(reroll){
  var k = dayKey(new Date()), d = lsGet('dinner', {day: '', i: -1});
  if (d.day !== k || reroll){ var ni = Math.floor(Math.random() * DINNERS.length); if (DINNERS.length > 1 && reroll) while (ni === d.i) ni = Math.floor(Math.random() * DINNERS.length); d = {day: k, i: ni}; lsSet('dinner', d); }
  $('bDinner').innerHTML = '<div class="k">CENA DE HOY</div><div class="big" style="font-size:36px;line-height:1.15">' + esc(DINNERS[d.i] || 'Añade ideas en Ajustes') + '</div><div class="sm">Toca para otra idea 🔄</div>';
}
$('bDinner').onclick = function(){ renderDinner(true); };
$('saveSet').onclick = function(){ function lines(s){ var a = s.split('\n'), o = [], i; for (i = 0; i < a.length; i++){ var t = a[i].replace(/^\s+|\s+$/g, ''); if (t) o.push(t); } return o; }
  CHORES = lines($('setChores').value); DINNERS = lines($('setDinners').value); lsSet('chores', CHORES); lsSet('dinners', DINNERS); kid.done = {}; lsSet('kid', kid); renderKids(); renderDinner(true); $('saveSet').textContent = 'Guardado ✓'; };
$('resetCal').onclick = function(){ try { localStorage.removeItem('calUrl'); } catch (e) {} location.href = location.pathname; };
$('reload').onclick = function(){ location.reload(); };

function renderAll(){ renderNext(); renderWeek(); renderCal(); }
function tick(){
  var n = new Date(); $('clock').textContent = hhmm(n); $('rclock').innerHTML = pad(n.getHours()) + '<br>' + pad(n.getMinutes()); $('night').textContent = hhmm(n);
  $('dateL').innerHTML = '<b>' + cap(DIAS[n.getDay()]) + '</b>' + n.getDate() + ' de ' + MESES[n.getMonth()]; renderNext();
}
$('setChores').value = CHORES.join('\n'); $('setDinners').value = DINNERS.join('\n');
$('calInfo').textContent = DEMO ? 'Calendario: modo demostración (abre la página con ?cal=…)' : 'Calendario conectado ✓';
tick(); renderKids(); renderShop(); renderDinner(false); loadCalendar(); loadWeather();
setInterval(tick, 10000); setInterval(loadCalendar, 300000); setInterval(loadWeather, 1800000);
setInterval(function(){ if (new Date().getHours() === 3 && new Date().getMinutes() < 1) location.reload(); }, 60000);
</script>
</body>
</html>
